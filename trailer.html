  <title>EZRA - Trailer Studio</title>

  <style>

    .controls>* { position:relative; z-index:1; }
    .brand { display:grid; gap:4px; padding-bottom:12px; border-bottom:1px solid var(--line); }
    .brand img { display:block; width:min(185px,100%); height:auto; } .brand span { color:var(--ink-soft); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; }
    .control-group { display:grid; gap:8px; } .control-label { color:var(--ink-soft); font-size:.68rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .segment { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
    .segment button,.play-btn,.export-btn,select { border:1px solid rgba(84,48,26,.47); border-radius:4px; color:var(--ink); background:rgba(255,251,235,.48); box-shadow:inset 0 1px rgba(255,255,255,.65); transition:background .16s,color .16s,transform .16s; }
    .segment button { min-height:38px; padding:6px 2px; font-size:.76rem; font-weight:800; }
    .segment button:hover,.play-btn:hover,select:hover { background:#fff9ea; } .segment button.active { color:#fff7e4; border-color:#4a2415; background:var(--wood); }
    select { width:100%; min-height:39px; padding:0 8px; outline:none; } select:focus { border-color:var(--red); }
    .range-row { display:grid; grid-template-columns:1fr 40px; gap:8px; align-items:center; } .range-value { color:var(--red); text-align:right; font-size:.76rem; font-variant-numeric:tabular-nums; }
    input[type='range'] { width:100%; accent-color:var(--red); }

    .export-btn:hover { background:#9a3228; transform:translateY(-1px); } .export-btn:disabled { cursor:wait; opacity:.65; transform:none; }
    .export-note { min-height:32px; margin:-2px 0 0; color:var(--ink-soft); font-size:.7rem; line-height:1.42; }
    .preview-area { position:relative; display:flex; min-width:0; flex-direction:column; align-items:center; justify-content:center; gap:18px; overflow:hidden; padding:24px clamp(18px,4vw,62px) 29px; background:#24160f; }
    .preview-area>* { position:relative; z-index:1; }
    .preview-head { display:flex; width:min(100%,1160px); align-items:center; justify-content:space-between; gap:14px; color:#e7d8b7; }
    .preview-title { margin:0; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; } .preview-title strong { color:#fff4dd; } .output-meta { color:rgba(237,217,178,.65); font-size:.73rem; font-variant-numeric:tabular-nums; }
